name: Paper backtest

# Replays public Coinbase candles through the paper-only bot on a GitHub runner,
# for when the cloud sandbox can't reach api.exchange.coinbase.com. No keys, no orders.
# Runs daily across every strategy so the scorecard stays current without anyone starting it.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: Days of history to replay
        default: "90"
      products:
        description: Comma-separated Coinbase products
        default: BTC-USD,ETH-USD,SOL-USD
      sweep_products:
        description: Products for the one-minute liquidity sweep replay
        default: BTC-USD,ETH-USD,SOL-USD,XRP-USD,DOGE-USD,AVAX-USD,LINK-USD
      only:
        description: Run only one job (backtest, sweep_1m, dex_1m or tournament); empty runs all
        default: ""
      variants:
        description: Comma-separated sweep_1m/dex_1m variants to run (e.g. magnet-aggressive); empty runs all
        default: ""
      dex_products:
        description: Solana DEX tokens for the one-minute DEX replay (JUP:<symbol> or JUP:<mint>@<decimals>)
        default: JUP:SOL,JUP:JUP,JUP:BONK,JUP:WIF
  push:
    branches: ["claude/paper-backtest**"]
    paths: [".github/workflows/paper-backtest.yml"]

permissions:
  contents: read

jobs:
  backtest:
    if: ${{ !inputs.only || inputs.only == 'backtest' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        strategy: [trend_breakout, ema_cross, zscore_reversion]
        days: ["90", "180"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run paper backtest
        working-directory: elevated-associates/trading
        env:
          DAYS: ${{ inputs.days || matrix.days }}
          PRODUCTS: ${{ inputs.products || 'BTC-USD,ETH-USD,SOL-USD' }}
          STRATEGY: ${{ matrix.strategy }}
        run: |
          python paperbot.py --history "$DAYS" --products "$PRODUCTS" --strategies "$STRATEGY" --out paper_runs/ci
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          s = json.load(open("paper_runs/ci/summary.json"))
          g = s["gate"]["checks"]
          print(f"### {os.environ['STRATEGY']} · {os.environ['DAYS']} days · {os.environ['PRODUCTS']}")
          print(f"trades {s['closed_trades']} · win {s['win_rate_pct']}% · expectancy {s['expectancy']} · "
                f"max DD {s['max_drawdown_pct']}% · return {s['return_pct']}% · fees {s['fees_paid']}")
          print(f"gate: {'PASS' if all(g.values()) else 'not passed'} {g}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: paper-backtest-${{ matrix.strategy }}-${{ matrix.days }}d
          path: elevated-associates/trading/paper_runs/ci

  sweep_1m:
    if: ${{ !inputs.only || inputs.only == 'sweep_1m' }}
    # Liquidity sweeps on one-minute candles. Replay compresses weeks of minutes into a few minutes.
    # fee 0.006 = Coinbase taker; fee 0.001 = what-if for low-cost venues (e.g. a Solana DEX).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        days: ["30", "90"]
        fee: ["0.006", "0.001"]
        variant: [baseline, buffer, big-pools, follow, magnet, magnet-follow, follow-aggressive, magnet-aggressive]
        include:
          # baseline: stop at the wick, 30-minute pools, exit at the first target
          - variant: baseline
            flags: ""
          # buffer: stop half an average bar range below the wick
          - variant: buffer
            flags: "--sweep-stop-buffer 0.5"
          # big-pools: 4-hour pools (bigger targets) with the buffered stop
          - variant: big-pools
            flags: "--sweep-lookback 240 --sweep-max-hold 240 --sweep-stop-buffer 0.5"
          # follow: big pools, then trail under the last 15 bars' lows after the target
          - variant: follow
            flags: "--sweep-lookback 240 --sweep-max-hold 240 --sweep-stop-buffer 0.5 --sweep-trail 15"
          # magnet: ride momentum toward untouched equal highs (4-hour window), exit at the magnet
          - variant: magnet
            flags: "--strategies liquidity_magnet --sweep-stop-buffer 0.5"
          # magnet-follow: as magnet, then trail under the last 15 bars' lows past the magnet
          - variant: magnet-follow
            flags: "--strategies liquidity_magnet --sweep-stop-buffer 0.5 --sweep-trail 15"
          # aggressive (opt-in profile): up to 10 open positions on 12 coins; other ELE-39 limits unchanged
          - variant: follow-aggressive
            flags: "--aggressive --products BTC-USD,ETH-USD,SOL-USD,XRP-USD,DOGE-USD,AVAX-USD,LINK-USD,ADA-USD,LTC-USD,DOT-USD,BCH-USD,UNI-USD --sweep-lookback 240 --sweep-max-hold 240 --sweep-stop-buffer 0.5 --sweep-trail 15"
          - variant: magnet-aggressive
            flags: "--aggressive --products BTC-USD,ETH-USD,SOL-USD,XRP-USD,DOGE-USD,AVAX-USD,LINK-USD,ADA-USD,LTC-USD,DOT-USD,BCH-USD,UNI-USD --strategies liquidity_magnet --sweep-stop-buffer 0.5"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Replay one-minute candles through liquidity_sweep / liquidity_magnet
        if: ${{ !inputs.variants || contains(format(',{0},', inputs.variants), format(',{0},', matrix.variant)) }}
        working-directory: elevated-associates/trading
        env:
          DAYS: ${{ matrix.days }}
          FEE: ${{ matrix.fee }}
          VARIANT: ${{ matrix.variant }}
          FLAGS: ${{ matrix.flags }}
          PRODUCTS: ${{ inputs.sweep_products || 'BTC-USD,ETH-USD,SOL-USD,XRP-USD,DOGE-USD,AVAX-USD,LINK-USD' }}
        run: |
          # shellcheck disable=SC2086  # FLAGS is a list of options
          python paperbot.py --history "$DAYS" --granularity 60 --fee "$FEE" --products "$PRODUCTS" \
            --strategies liquidity_sweep $FLAGS --out paper_runs/ci
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          s = json.load(open("paper_runs/ci/summary.json"))
          g = s["gate"]["checks"]
          print(f"### liquidity {os.environ['VARIANT']} · 1m · {os.environ['DAYS']} days · fee {os.environ['FEE']} · "
                f"profile {s['risk_profile']} (max {s['max_positions']} open)")
          print(f"trades {s['closed_trades']} · win {s['win_rate_pct']}% · expectancy {s['expectancy']} · "
                f"max DD {s['max_drawdown_pct']}% · return {s['return_pct']}% · fees {s['fees_paid']}")
          print(f"gate: {'PASS' if all(g.values()) else 'not passed'} {g}")
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.variants || contains(format(',{0},', inputs.variants), format(',{0},', matrix.variant)) }}
        with:
          name: paper-backtest-sweep-1m-${{ matrix.variant }}-${{ matrix.days }}d-fee${{ matrix.fee }}
          path: elevated-associates/trading/paper_runs/ci

  dex_1m:
    if: ${{ !inputs.only || inputs.only == 'dex_1m' }}
    # Decentralized: one-minute candles from Solana DEX pools (GeckoTerminal, built from on-chain swaps).
    # --dex-fee 0.003 charges each swap a 0.25% pool fee plus network fee and margin.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2  # GeckoTerminal's free API is rate-limited; more parallel jobs get HTTP 429
      matrix:
        days: ["30", "90"]
        variant: [baseline, follow, magnet, magnet-follow]
        include:
          - variant: baseline
            flags: "--strategies liquidity_sweep"
          - variant: follow
            flags: "--strategies liquidity_sweep --sweep-lookback 240 --sweep-max-hold 240 --sweep-stop-buffer 0.5 --sweep-trail 15"
          - variant: magnet
            flags: "--strategies liquidity_magnet --sweep-stop-buffer 0.5"
          - variant: magnet-follow
            flags: "--strategies liquidity_magnet --sweep-stop-buffer 0.5 --sweep-trail 15"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Replay one-minute Solana DEX candles
        if: ${{ !inputs.variants || contains(format(',{0},', inputs.variants), format(',{0},', matrix.variant)) }}
        working-directory: elevated-associates/trading
        env:
          DAYS: ${{ matrix.days }}
          VARIANT: ${{ matrix.variant }}
          FLAGS: ${{ matrix.flags }}
          PRODUCTS: ${{ inputs.dex_products || 'JUP:SOL,JUP:JUP,JUP:BONK,JUP:WIF' }}
        run: |
          # shellcheck disable=SC2086  # FLAGS is a list of options
          python paperbot.py --dex-history "$DAYS" --dex-fee 0.003 --products "$PRODUCTS" $FLAGS --out paper_runs/ci
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          s = json.load(open("paper_runs/ci/summary.json"))
          g = s["gate"]["checks"]
          print(f"### DEX {os.environ['VARIANT']} · 1m · {os.environ['DAYS']} days · {os.environ['PRODUCTS']}")
          print(f"trades {s['closed_trades']} · win {s['win_rate_pct']}% · expectancy {s['expectancy']} · "
                f"max DD {s['max_drawdown_pct']}% · return {s['return_pct']}% · fees {s['fees_paid']} · "
                f"history {s['gate']['days_running']} days")
          print(f"gate: {'PASS' if all(g.values()) else 'not passed'} {g}")
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.variants || contains(format(',{0},', inputs.variants), format(',{0},', matrix.variant)) }}
        with:
          name: paper-backtest-dex-1m-${{ matrix.variant }}-${{ matrix.days }}d
          path: elevated-associates/trading/paper_runs/ci

  tournament:
    if: ${{ !inputs.only || inputs.only == 'tournament' }}
    # Strategy tournament: 44 candidates across all 7 strategy families, run in parallel on one
    # download. First 2/3 of the history picks settings; the last 1/3 is the out-of-sample test.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2  # keeps the free candle APIs under their rate limits
      matrix:
        include:
          - dataset: coinbase-1m-30d-fee0.006
            flags: "--history 30 --granularity 60 --fee 0.006 --products BTC-USD,ETH-USD,SOL-USD"
          - dataset: coinbase-1m-30d-fee0.001
            flags: "--history 30 --granularity 60 --fee 0.001 --products BTC-USD,ETH-USD,SOL-USD"
          - dataset: coinbase-1h-365d-fee0.006
            flags: "--history 365 --granularity 3600 --fee 0.006 --products BTC-USD,ETH-USD,SOL-USD"
          - dataset: dex-1m-30d
            flags: "--dex-history 30 --dex-fee 0.003 --products JUP:SOL,JUP:JUP,JUP:BONK,JUP:WIF"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run the tournament
        working-directory: elevated-associates/trading
        env:
          FLAGS: ${{ matrix.flags }}
        run: |
          # shellcheck disable=SC2086  # FLAGS is a list of options
          python tournament.py $FLAGS --out paper_runs/ci
          cat paper_runs/ci/leaderboard.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: paper-tournament-${{ matrix.dataset }}
          path: |
            elevated-associates/trading/paper_runs/ci/leaderboard.*
