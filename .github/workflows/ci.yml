name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Paper trading tests
        working-directory: elevated-associates/trading
        run: python -m unittest -v test_paperbot test_alpaca_paper test_jesse_setup
      - name: Validate venture registry
        run: python elevated-associates/ops/ea_status.py --check
      - name: Bridge compiles
        run: python -m py_compile start.py app.py login_bridge.py
